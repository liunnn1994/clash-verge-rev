name: Upstream Sync

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream stable tag. Empty = latest stable.'
        required: false
        default: ''
      preview_only:
        description: 'Validate the upstream overlay without publishing source or a release.'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: clash-verge-rev/clash-verge-rev
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Resolve upstream release
        id: upstream
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          if [ "$TAG" = "v$VERSION" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply the fork overlay to upstream source
        if: steps.upstream.outputs.skip != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          # Use an isolated ref; upstream tags must not overwrite fork release tags.
          git fetch upstream "refs/tags/$TAG:refs/remotes/upstream/release"
          git restore --source=refs/remotes/upstream/release --staged --worktree -- . \
            ':(exclude).github/workflows' ':(exclude)AGENTS.md' \
            ':(exclude)scripts/fork-overlay.mjs' ':(exclude)scripts/ninja-kernel.mjs'
          node scripts/fork-overlay.mjs
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          [ "$TAG" = "v$VERSION" ]
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream $TAG with the Ninja kernel overlay"
          fi
      - name: Publish source and dispatch one release build
        if: steps.upstream.outputs.skip != 'true' && !inputs.preview_only
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent; then
            echo "::error::Release $TAG already exists; automatic sync must not replace it"
            exit 1
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          # GITHUB_TOKEN tag pushes do not trigger the release workflow.
          gh workflow run release.yml -f tag="$TAG"
      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          SKIP: ${{ steps.upstream.outputs.skip }}
          STATUS: ${{ job.status }}
          PREVIEW: ${{ inputs.preview_only }}
        run: |
          if [ "$SKIP" = 'true' ]; then
            echo "Already synchronized with $TAG." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STATUS" = 'success' ] && [ "$PREVIEW" = 'true' ]; then
            echo "Validated the fork overlay against $TAG without publication." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STATUS" = 'success' ]; then
            echo "Applied the fork overlay to $TAG and dispatched one release build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sync stopped before publication or dispatch. Review the failed step before retrying." >> "$GITHUB_STEP_SUMMARY"
          fi
